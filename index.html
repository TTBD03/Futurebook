<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eceefa;--card:#fff;--ink:#151530;--mute:#63678a;--line:#dfe2f3;--pri:#3030e8;--onpri:#fff;--like:#ff4f5e;--soft:#e8e8ff;color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.logo{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--pri);letter-spacing:-.03em}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
.auth .logo{font-size:3rem}
.auth p{color:var(--mute);margin:.25rem 0 1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--pri);padding:0;font-weight:600}
.msg{margin:0 0 10px;min-height:1.4em;color:var(--like)}
.msg.ok{color:var(--pri)}
header.top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.meta small{color:var(--mute);display:block}
.post p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:8px;align-items:center}
.acts button{background:none;border:0;color:var(--mute);font-weight:600;padding:4px 0}
.acts button.on{color:var(--like)}
.cmt{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;overflow-wrap:anywhere}
.cmt b{margin-right:6px}
.side h3{font-size:1.05rem;margin-bottom:10px}
.side .row{margin-bottom:10px}
.empty{color:var(--mute);margin:0 0 10px}
a.logo{text-decoration:none}
.nav{color:var(--mute);text-decoration:none;font-weight:600;padding:4px 8px;border-radius:8px}
.nav.cur{color:var(--pri);background:var(--soft)}
a.nm{color:inherit;font-weight:700;text-decoration:none;margin-right:6px}
a.nm:hover{text-decoration:underline}
a.note{color:inherit;text-decoration:none}
.card h2{margin-bottom:10px}
.profile{display:flex;gap:18px;align-items:center}
.av.big{width:96px;height:96px;font-size:2.2rem}
.badge{background:var(--soft);padding:4px 12px;border-radius:999px;font-weight:600}
h3.sub{font-size:1rem;margin:18px 0 8px}
.note{padding:6px 8px;border-radius:10px;margin-bottom:6px}
.note.unread{background:var(--soft)}
.when{display:block;color:var(--mute)}
img.av{object-fit:cover}
.ptabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:4px 0 12px}
.ptabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--mute)}
.ptabs button[aria-selected=true]{color:var(--pri);border-bottom-color:var(--pri)}
.pcap{margin:-4px 0 10px;color:var(--mute);font-size:.95rem;overflow-wrap:anywhere}
.pcap button{background:none;border:0;color:var(--pri);padding:0 0 0 8px;font-size:.85rem}
.pimg{width:100%;max-height:560px;object-fit:cover;border-radius:12px;margin:6px 0 10px;display:block}
input[type=file]{padding:8px}
.foot{max-width:980px;margin:0 auto;padding:8px 16px 32px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot .cp{color:var(--mute);font-size:.9rem;margin-left:auto}
.authcp{text-align:center;color:var(--mute);font-size:.85rem;margin-top:24px}
.foot a{color:var(--mute)}
.pcard{overflow:hidden}
.cover{height:180px;margin:-16px -16px 14px;background:linear-gradient(135deg,var(--pri),var(--soft))}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ver{color:var(--pri);font-weight:800;margin-left:6px}
.handle{color:var(--mute);margin-top:-2px}
.bio{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.about dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px}
.about dt{color:var(--mute)}
.about dd{margin:0;overflow-wrap:anywhere}
.about a{color:var(--pri)}
.hint{color:var(--mute);font-size:.9rem;margin:6px 0 0}
label.f{display:block}
label.f span{display:block;font-weight:600;margin:6px 0 4px}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font:inherit;color:inherit}
.react{position:relative;display:inline-block}
.rbtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.rbtn .em{display:inline-block;filter:grayscale(1);opacity:.65}
.rbtn.on .em{filter:none;opacity:1}
.rbtn.pop .em{animation:rbtnpop .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes rbtnpop{0%{transform:scale(.3) rotate(-25deg)}60%{transform:scale(1.55) rotate(10deg)}100%{transform:none}}
.rpick{position:absolute;left:0;bottom:calc(100% + 6px);display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;visibility:hidden;transform:translateY(10px) scale(.9);transform-origin:left bottom;transition:opacity .15s,transform .2s,visibility 0s .2s;z-index:20}
.rpick::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px}
.react.open .rpick{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.react.open .rpick button{animation:rin .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*45ms)}
@media (hover:hover){.react:hover .rpick{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.react:hover .rpick button{animation:rin .35s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*45ms)}}
.react:has(:focus-visible) .rpick{opacity:1;visibility:visible;transform:none;transition-delay:0s}
@keyframes rin{from{opacity:0;transform:translateY(14px) scale(.4)}to{opacity:1;transform:none}}
.rpick button{background:none;border:0;font-size:1.7rem;line-height:1;padding:4px;border-radius:50%;cursor:pointer;transition:transform .15s}
.rpick button span{display:inline-block}
.rpick button:hover,.rpick button:focus-visible{transform:scale(1.4) translateY(-6px)}
.k-like:hover span,.k-like:focus-visible span{animation:rwow .6s ease-in-out infinite}
.k-haha:hover span,.k-haha:focus-visible span{animation:rlaugh .45s ease-in-out infinite}
.k-sad:hover span,.k-sad:focus-visible span{animation:rsad 1.1s ease-in-out infinite}
.k-wow:hover span,.k-wow:focus-visible span{animation:rwow .6s ease-in-out infinite}
.k-angry:hover span,.k-angry:focus-visible span{animation:rangry .22s linear infinite}
.k-confused:hover span,.k-confused:focus-visible span{animation:rconf 1s ease-in-out infinite}
@keyframes rlaugh{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-2px)}}
@keyframes rsad{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(.92)}}
@keyframes rwow{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes rangry{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes rconf{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.fly{position:absolute;left:8px;bottom:100%;font-size:1.25rem;pointer-events:none;opacity:0;animation:rfly 1s ease-out forwards;animation-delay:calc(var(--d)*1ms);z-index:21}
@keyframes rfly{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-70px) scale(1.2)}}
.rsum{display:inline-flex;gap:10px;color:var(--mute);font-size:.95rem;align-items:center}
.rsum span{white-space:nowrap}
button.rsum{background:none;border:0;padding:2px 4px;cursor:pointer;font:inherit;border-radius:6px}
button.rsum:hover{text-decoration:underline}
.ovl{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.pop{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:380px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pop header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pop header button{background:none;border:0;font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:8px}
.pop .list{overflow-y:auto;padding:8px 16px 12px}
.pop .row{margin:6px 0;align-items:center}
.pop .rx{margin-left:auto;font-size:1.2rem}
@media (prefers-reduced-motion:reduce){.rpick,.rpick button,.rpick button span,.rbtn .em,.fly{animation:none!important;transition:none!important}}
</style>
</head>

if(r.error){if(path)await sb.storage.from("post-images").remove([path]);throw dbErr(r.error)}}
function shareDlg(p){
var sel=el("select",{"aria-label":"Who can see your shared post"},[el("option",{value:"friends"},["\ud83d\udc65 Friends"]),el("option",{value:"public"},["\ud83c\udf10 Public"])]);

act(async function(){await doShare(p,a);say("Shared to your feed ("+(a==="public"?"public":"friends only")+").",true)})}},["Share now"]);

el("div",{class:"pop",role:"dialog","aria-modal":"true","aria-label":"Share post"},[
el("header",{},[el("h3",{},["Share this post"]),close]),

el("label",{},["Who can see it?"]),sel,
el("div",{class:"row"},[go,link])])])]);

async function sharePost(p){
var url=location.href.split("#")[0]+"#post/"+p.id;
var text=(p.body.trim()||p.caption||"").slice(0,100);
if(navigator.share){try{await navigator.share({title:"Post by "+nm(p.user_id)+" on Futurebook",text:text,url:url})}catch(e){}return}
try{await navigator.clipboard.writeText(url);say("Link copied. Anyone logged in who can see this post can open it.",true);draw()}
catch(e){prompt("Copy this link:",url)}}
function dbErr(e){var m=(e&&e.message)||"";if(/caption|visibility|shared_from_user/i.test(m))return new Error("This needs a one-time database update. Run the latest SQL from the chat, then try again.");return e}
function capEl(p){
var own=p.user_id===me.id;if(!p.caption&&!own)return "";
var kids=[];if(p.caption)kids.push(p.caption);
if(own)kids.push(el("button",{type:"button",onclick:function(){var v=prompt("Photo caption",p.caption||"");if(v===null)return;v=v.trim().slice(0,300);
act(async function(){var r=await sb.from("posts").update({caption:v||null}).eq("id",p.id).select();
if(r.error)throw new Error(/caption/i.test(r.error.message||"")?"Captions need a one-time database update (add a 'caption' column to posts).":r.error.message);
if(!r.data||!r.data.length)throw new Error("Couldn’t save the caption. Please try again.")})}},[p.caption?"Edit":"Add caption"]));
return el("div",{class:"pcap"},kids)}
function post(p){
var likes=D.likes.filter(function(l){return l.post_id===p.id});
var cms=D.comments.filter(function(c){return c.post_id===p.id});
var cin=el("input",{placeholder:"Write a comment","aria-label":"Write a comment",maxlength:"1000"});
cin.addEventListener("keydown",function(e){if(e.key==="Enter"&&cin.value.trim()){var v=cin.value.trim();
act(async function(){var r=await sb.from("comments").insert({post_id:p.id,user_id:me.id,body:v});if(r.error)throw r.error})}});
var acts=[reactBar(p,likes),reactSum(likes,p.id),
el("span",{class:"empty"},[cms.length+(cms.length===1?" comment":" comments")]),
el("button",{type:"button","aria-label":"Share this post",onclick:function(){shareFor=p.id;draw()}},["Share"])];
if(p.user_id!==me.id){
acts.push(el("button",{onclick:function(){var why=prompt("Why are you reporting this post?");if(!why||!why.trim())return;
act(async function(){var r=await sb.from("reports").insert({reporter:me.id,post_id:p.id,reported_user:p.user_id,reason:why.trim().slice(0,500)});if(r.error)throw r.error;say("Thanks. Your report was sent.",true)})}},["Report"]));
acts.push(el("button",{onclick:function(){if(!confirm("Block "+nm(p.user_id)+"? You will no longer be friends and they can’t send you requests."))return;
act(async function(){var u=p.user_id;var r=await sb.from("blocks").insert({blocker:me.id,blocked:u});if(r.error)throw r.error;
var d=await sb.from("friendships").delete().or("and(requester.eq."+me.id+",addressee.eq."+u+"),and(requester.eq."+u+",addressee.eq."+me.id+")");if(d.error)throw d.error;say(nm(u)+" is blocked.",true)})}},["Block"]));
}
if(p.user_id===me.id)acts.push(el("button",{onclick:function(){if(confirm("Delete this post?"))act(async function(){var r=await sb.from("posts").delete().eq("id",p.id);if(r.error)throw r.error;if(p.image_path)await sb.storage.from("post-images").remove([p.image_path])})}},["Delete"]));
return el("article",{class:"card post"},[
el("div",{class:"row"},[av(p.user_id),el("div",{class:"meta"},[el("a",{class:"nm",href:"#profile/"+p.user_id},[nm(p.user_id)]),el("small",{},[ago(p.created_at)+(p.visibility?(p.visibility==="public"?" \u00b7 \ud83c\udf10 Public":" \u00b7 \ud83d\udc65 Friends"):"")])])]),
p.shared_from_user&&p.shared_from_user!==p.user_id?el("p",{class:"empty"},["Shared from ",el("a",{class:"nm",href:"#profile/"+p.shared_from_user},[nm(p.shared_from_user)])]):"",
p.body.trim()?el("p",{},[p.body]):"",
p.image_path&&D.imgs[p.image_path]?el("img",{class:"pimg",src:D.imgs[p.image_path],alt:p.caption||("Photo shared by "+nm(p.user_id)),loading:"lazy"}):"",
p.image_path?capEl(p):"",
el("div",{class:"acts"},acts),
openLikes===p.id&&likes.length?likersPop(likes):"",
shareFor===p.id?shareDlg(p):"",
el("div",{},cms.map(function(c){return el("div",{class:"cmt"},[el("a",{class:"nm",href:"#profile/"+c.user_id},[nm(c.user_id)]),c.body])})),
el("div",{style:"margin-top:8px"},[cin])])}

function side(){
var incoming=D.fs.filter(function(f){return f.addressee===me.id&&f.status==="pending"&&D.names[f.requester]});
var friends=D.fs.filter(function(f){return f.status==="accepted"}).map(function(f){return f.requester===me.id?f.addressee:f.requester}).filter(function(id){return D.names[id]});
var linked={};D.fs.forEach(function(f){linked[f.requester===me.id?f.addressee:f.requester]=f});
var reqs=incoming.map(function(f){return el("div",{class:"row"},[av(f.requester),el("a",{class:"nm",href:"#profile/"+f.requester},[nm(f.requester)]),
el("button",{class:"btn",onclick:function(){act(async function(){var r=await sb.from("friendships").update({status:"accepted"}).eq("id",f.id);if(r.error)throw r.error})}},["Accept"]),
el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").delete().eq("id",f.id);if(r.error)throw r.error})}},["Decline"])])});
var others=Object.keys(D.names).filter(function(id){return id!==me.id&&!linked[id]&&D.blocked.indexOf(id)<0}).map(function(id){
return el("div",{class:"row"},[av(id),el("a",{class:"nm",href:"#profile/"+id},[nm(id)]),el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").insert({requester:me.id,addressee:id});if(r.error)throw r.error})}},["Add friend"])])});
var sent=D.fs.filter(function(f){return f.requester===me.id&&f.status==="pending"&&D.names[f.addressee]}).map(function(f){
return el("div",{class:"row"},[av(f.addressee),el("span",{},[el("a",{class:"nm",href:"#profile/"+f.addressee},[nm(f.addressee)])," (request sent)"])])});
var fr=friends.map(function(id){return el("div",{class:"row"},[av(id),el("a",{class:"nm",href:"#profile/"+id},[nm(id)])])});
function box(title,items,emptyText){return el("div",{class:"card"},[el("h3",{},[title])].concat(items.length?items:[el("p",{class:"empty"},[emptyText])]))}
return el("aside",{class:"side"},[
box("Friend requests",reqs,"No new requests."),
box("People you may know",others.concat(sent),"No one else has joined yet. Invite a friend!"),
box("Your friends ("+friends.length+")",fr,"Add your first friend.")])}
