<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futurebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eceefa;--card:#fff;--ink:#151530;--mute:#63678a;--line:#dfe2f3;--pri:#3030e8;--onpri:#fff;--like:#ff4f5e;--soft:#e8e8ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#191a31;--ink:#eef0ff;--mute:#9a9ec6;--line:#2a2c4d;--pri:#8c8cff;--onpri:#10102a;--like:#ff7480;--soft:#26284a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.logo{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--pri);letter-spacing:-.03em}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
.auth .logo{font-size:3rem}
.auth p{color:var(--mute);margin:.25rem 0 1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--pri);padding:0;font-weight:600}
.msg{margin:0 0 10px;min-height:1.4em;color:var(--like)}
.msg.ok{color:var(--pri)}
header.top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.meta small{color:var(--mute);display:block}
.post p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:8px;align-items:center}
.acts button{background:none;border:0;color:var(--mute);font-weight:600;padding:4px 0}
.acts button.on{color:var(--like)}
.cmt{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;overflow-wrap:anywhere}
.cmt b{margin-right:6px}
.side h3{font-size:1.05rem;margin-bottom:10px}
.side .row{margin-bottom:10px}
.empty{color:var(--mute);margin:0 0 10px}
a.logo{text-decoration:none}
.nav{color:var(--mute);text-decoration:none;font-weight:600;padding:4px 8px;border-radius:8px}
.nav.cur{color:var(--pri);background:var(--soft)}
a.nm{color:inherit;font-weight:700;text-decoration:none;margin-right:6px}
a.nm:hover{text-decoration:underline}
a.note{color:inherit;text-decoration:none}
.card h2{margin-bottom:10px}
.profile{display:flex;gap:18px;align-items:center}
.av.big{width:96px;height:96px;font-size:2.2rem}
.badge{background:var(--soft);padding:4px 12px;border-radius:999px;font-weight:600}
h3.sub{font-size:1rem;margin:18px 0 8px}
.note{padding:6px 8px;border-radius:10px;margin-bottom:6px}
.note.unread{background:var(--soft)}
.when{display:block;color:var(--mute)}
img.av{object-fit:cover}
.pimg{width:100%;max-height:560px;object-fit:cover;border-radius:12px;margin:6px 0 10px;display:block}
input[type=file]{padding:8px}
.foot{max-width:980px;margin:0 auto;padding:8px 16px 32px;display:flex;gap:16px}
.foot a{color:var(--mute)}
.pcard{overflow:hidden}
.cover{height:180px;margin:-16px -16px 14px;background:linear-gradient(135deg,var(--pri),var(--soft))}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ver{color:var(--pri);font-weight:800;margin-left:6px}
.handle{color:var(--mute);margin-top:-2px}
.bio{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.about dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px}
.about dt{color:var(--mute)}
.about dd{margin:0;overflow-wrap:anywhere}
.about a{color:var(--pri)}
.hint{color:var(--mute);font-size:.9rem;margin:6px 0 0}
label.f{display:block}
label.f span{display:block;font-weight:600;margin:6px 0 4px}
select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font:inherit;color:inherit}
</style>
</head>

function coverInput(){return el("input",{type:"file",id:"coverfile",accept:"image/jpeg,image/png,image/webp","aria-label":"Choose a cover photo",style:"display:none",onchange:function(e){var f=e.target.files[0];if(!f)return;
act(async function(){var b=await shrink(f,1600);var path=me.id+"/cover.jpg";
var up=await sb.storage.from("covers").upload(path,b,{contentType:"image/jpeg",upsert:true});if(up.error)throw up.error;
var url=sb.storage.from("covers").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
var r=await sb.from("profiles").update({cover_url:url}).eq("id",me.id);if(r.error)throw r.error;say("Cover photo updated.",true)})}})}
function removeCover(){if(!confirm("Remove your cover photo?"))return;
act(async function(){var r=await sb.from("profiles").update({cover_url:null}).eq("id",me.id);if(r.error)throw r.error;
await sb.storage.from("covers").remove([me.id+"/cover.jpg"]);say("Cover photo removed.",true)})}
function aboutCard(id,mine){
var x=X[id];
if(!x||x.loading)return el("div",{class:"card about"},[el("h3",{},["About"]),el("p",{class:"empty"},["Loading…"])]);
if(x.fail)return el("div",{class:"card about"},[el("h3",{},["About"]),el("p",{class:"empty"},["Details aren’t available right now."])]);
var d=x.d||{},c=x.c||{},rows=[];
function add(k,v){if(v)rows.push([k,typeof v==="string"?document.createTextNode(v):v])}
add("Education",d.education);add("Workplace",d.workplace);add("Lives in",d.current_city);add("From",d.hometown);add("Relationship",d.relationship_status);
var site=safeUrl(d.website);
if(site)add("Website",el("a",{href:site,target:"_blank",rel:"noopener noreferrer nofollow"},[site.replace(/^https?:\/\//i,"")]));
if(mine||isFriend(id)){add("Email",c.contact_email);add("Phone",c.phone)}
var dl=el("dl",{},[]);
rows.forEach(function(r){dl.appendChild(el("dt",{},[r[0]]));var dd=el("dd",{},[]);dd.appendChild(r[1]);dl.appendChild(dd)});
return el("div",{class:"card about"},[el("h3",{},["About"]),
rows.length?dl:el("p",{class:"empty"},[mine?"Nothing here yet. Use Edit profile to add your details.":"Nothing to show yet."]),
mine?el("p",{class:"hint"},["Your email and phone are visible to you and your friends only. Everything else here is visible to signed-in members."]):""])}
function editForm(id){
var u=D.info[id]||{},x=X[id]||{},d=x.d||{},c=x.c||{};
var v=draft||{username:u.username,bio:u.bio,education:d.education||"",workplace:d.workplace||"",city:d.current_city||"",home:d.hometown||"",rel:d.relationship_status||"",site:d.website||"",email:c.contact_email||"",phone:c.phone||""};
var F={};
function line(label,key,max,ph,type){F[key]=el("input",{type:type||"text",value:v[key]||"",maxlength:String(max),placeholder:ph||""});return el("label",{class:"f"},[el("span",{},[label]),F[key]])}
var bio=el("textarea",{rows:"3",maxlength:"300",placeholder:"A few words about you"},[v.bio||""]);
var rel=el("select",{},[el("option",{value:""},["Not specified"])].concat(REL.map(function(r){return el("option",{value:r},[r])})));rel.value=v.rel||"";
function collect(){return {username:F.username.value.trim().toLowerCase().replace(/^@/,""),bio:bio.value.trim(),education:F.education.value.trim(),workplace:F.workplace.value.trim(),city:F.city.value.trim(),home:F.home.value.trim(),rel:rel.value,site:F.site.value.trim(),email:F.email.value.trim(),phone:F.phone.value.trim()}}
var form=[line("Username","username",20,"letters, numbers, underscores"),
el("label",{class:"f"},[el("span",{},["Bio"]),bio]),
line("Education","education",120,"School or university"),
line("Workplace","workplace",120,"Where you work"),
line("Current city","city",80),
line("Hometown","home",80),
el("label",{class:"f"},[el("span",{},["Relationship status"]),rel]),
line("Website","site",200,"https://example.com"),
line("Contact email (friends only)","email",120,"","email"),
line("Phone (friends only)","phone",30,"","tel")];
var save=el("button",{class:"btn",onclick:function(){act(async function(){
var f=collect();draft=f;
if(f.username&&!/^[a-z0-9_]{3,20}$/.test(f.username))throw new Error("Username must be 3–20 letters, numbers or underscores.");
var site=f.site;
if(site){if(!/^https?:\/\//i.test(site))site="https://"+site;var good=true;try{good=/^https?:$/.test(new URL(site).protocol)}catch(e){good=false}if(!good)throw new Error("That website link doesn’t look right.")}
if(f.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email))throw new Error("That contact email doesn’t look right.");
if(f.phone&&!/^[0-9+()\-\s.]{5,30}$/.test(f.phone))throw new Error("That phone number doesn’t look right.");
var now=new Date().toISOString();
var r1=await sb.from("profiles").update({username:f.username||null,bio:f.bio||null}).eq("id",me.id);
if(r1.error)throw r1.error.code==="23505"?new Error("That username is taken."):r1.error;
var r2=await sb.from("profile_details").upsert({user_id:me.id,education:f.education||null,workplace:f.workplace||null,current_city:f.city||null,hometown:f.home||null,relationship_status:f.rel||null,website:site||null,updated_at:now});
if(r2.error)throw r2.error;
var r3=await sb.from("profile_contact").upsert({user_id:me.id,contact_email:f.email||null,phone:f.phone||null,updated_at:now});
if(r3.error)throw r3.error;
draft=null;editing=false;X={};say("Profile saved.",true)})}},["Save"]);
var cancel=el("button",{class:"btn alt",onclick:function(){editing=false;draft=null;draw()}},["Cancel"]);
return el("div",{class:"card"},[el("h3",{},["Edit profile"])].concat(form,[el("div",{class:"row"},[save,cancel])]))}
function profilePage(id){
if(!D.names[id])return el("div",{class:"card"},[el("p",{class:"empty"},["This profile isn’t available."])]);
if(!X[id])loadExtras(id);
var mine=id===me.id,big=av(id);big.classList.add("big");
var u=D.info[id]||{},ready=!(X[id]&&X[id].loading);
var acts=mine?[avInput(),coverInput(),
el("button",{class:"btn alt",onclick:function(){document.getElementById("avfile").click()}},["Change photo"]),
el("button",{class:"btn alt",onclick:function(){document.getElementById("coverfile").click()}},["Change cover"])]
.concat(u.cover?[el("button",{class:"btn alt",onclick:removeCover},["Remove cover"])]:[])
.concat([el("button",{class:"btn",disabled:ready?null:"disabled",onclick:function(){editing=!editing;draft=null;draw()}},[editing?"Cancel":"Edit profile"])])
:friendActions(id);
var posts=D.posts.filter(function(p){return p.user_id===id});
return el("div",{},[
el("div",{class:"card pcard"},[
el("div",{class:"cover"},u.cover?[el("img",{src:u.cover,alt:"Cover photo of "+nm(id)})]:[]),
el("div",{class:"profile"},[big,el("div",{},[
el("h2",{},[nm(id)].concat(u.verified?[verMark()]:[])),
u.username?el("div",{class:"handle"},["@"+u.username]):"",
u.bio?el("p",{class:"bio"},[u.bio]):"",
el("div",{class:"row",style:"margin-top:10px"},acts)])])]),
(editing&&mine&&ready)?editForm(id):aboutCard(id,mine),
el("h3",{class:"sub"},["Posts"]),
el("div",{},posts.length?posts.map(post):[el("p",{class:"empty"},[mine?"You haven’t posted yet.":"No posts to show."])])])}

function feed(){
var r=route(),body;
if(r.name==="notifications")body=notesPage();
else if(r.name==="settings")body=settingsPage();
else if(r.name==="profile")body=profilePage(r.id);
else body=homePage();
return el("div",{},[header(),
el("div",{class:"wrap"},[el("main",{},[msgEl(),body]),side()]),
el("footer",{class:"foot"},[el("a",{href:"privacy.html"},["Privacy"]),el("a",{href:"terms.html"},["Terms"])])])}

function post(p){
var likes=D.likes.filter(function(l){return l.post_id===p.id});
var liked=likes.some(function(l){return l.user_id===me.id});
var cms=D.comments.filter(function(c){return c.post_id===p.id});
var cin=el("input",{placeholder:"Write a comment","aria-label":"Write a comment",maxlength:"1000"});
cin.addEventListener("keydown",function(e){if(e.key==="Enter"&&cin.value.trim()){var v=cin.value.trim();
act(async function(){var r=await sb.from("comments").insert({post_id:p.id,user_id:me.id,body:v});if(r.error)throw r.error})}});
var acts=[el("button",{class:liked?"on":"","aria-pressed":String(liked),onclick:function(){act(async function(){
var r=liked?await sb.from("likes").delete().eq("post_id",p.id).eq("user_id",me.id):await sb.from("likes").insert({post_id:p.id,user_id:me.id});if(r.error)throw r.error})}},[(liked?"Liked":"Like")+" ("+likes.length+")"]),
el("span",{class:"empty"},[cms.length+(cms.length===1?" comment":" comments")])];
if(p.user_id!==me.id){
acts.push(el("button",{onclick:function(){var why=prompt("Why are you reporting this post?");if(!why||!why.trim())return;
act(async function(){var r=await sb.from("reports").insert({reporter:me.id,post_id:p.id,reported_user:p.user_id,reason:why.trim().slice(0,500)});if(r.error)throw r.error;say("Thanks. Your report was sent.",true)})}},["Report"]));
acts.push(el("button",{onclick:function(){if(!confirm("Block "+nm(p.user_id)+"? You will no longer be friends and they can’t send you requests."))return;
act(async function(){var u=p.user_id;var r=await sb.from("blocks").insert({blocker:me.id,blocked:u});if(r.error)throw r.error;
var d=await sb.from("friendships").delete().or("and(requester.eq."+me.id+",addressee.eq."+u+"),and(requester.eq."+u+",addressee.eq."+me.id+")");if(d.error)throw d.error;say(nm(u)+" is blocked.",true)})}},["Block"]));
}
if(p.user_id===me.id)acts.push(el("button",{onclick:function(){if(confirm("Delete this post?"))act(async function(){var r=await sb.from("posts").delete().eq("id",p.id);if(r.error)throw r.error;if(p.image_path)await sb.storage.from("post-images").remove([p.image_path])})}},["Delete"]));
return el("article",{class:"card post"},[
el("div",{class:"row"},[av(p.user_id),el("div",{class:"meta"},[el("a",{class:"nm",href:"#profile/"+p.user_id},[nm(p.user_id)]),el("small",{},[ago(p.created_at)])])]),
p.body.trim()?el("p",{},[p.body]):"",
p.image_path&&D.imgs[p.image_path]?el("img",{class:"pimg",src:D.imgs[p.image_path],alt:"Photo shared by "+nm(p.user_id),loading:"lazy"}):"",
el("div",{class:"acts"},acts),
el("div",{},cms.map(function(c){return el("div",{class:"cmt"},[el("a",{class:"nm",href:"#profile/"+c.user_id},[nm(c.user_id)]),c.body])})),
el("div",{style:"margin-top:8px"},[cin])])}

function side(){
var incoming=D.fs.filter(function(f){return f.addressee===me.id&&f.status==="pending"&&D.names[f.requester]});
var friends=D.fs.filter(function(f){return f.status==="accepted"}).map(function(f){return f.requester===me.id?f.addressee:f.requester}).filter(function(id){return D.names[id]});
var linked={};D.fs.forEach(function(f){linked[f.requester===me.id?f.addressee:f.requester]=f});
var reqs=incoming.map(function(f){return el("div",{class:"row"},[av(f.requester),el("span",{},[nm(f.requester)]),
el("button",{class:"btn",onclick:function(){act(async function(){var r=await sb.from("friendships").update({status:"accepted"}).eq("id",f.id);if(r.error)throw r.error})}},["Accept"]),
el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").delete().eq("id",f.id);if(r.error)throw r.error})}},["Decline"])])});
var others=Object.keys(D.names).filter(function(id){return id!==me.id&&!linked[id]&&D.blocked.indexOf(id)<0}).map(function(id){
return el("div",{class:"row"},[av(id),el("span",{},[nm(id)]),el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").insert({requester:me.id,addressee:id});if(r.error)throw r.error})}},["Add friend"])])});
var sent=D.fs.filter(function(f){return f.requester===me.id&&f.status==="pending"&&D.names[f.addressee]}).map(function(f){
return el("div",{class:"row"},[av(f.addressee),el("span",{},[nm(f.addressee)+" (request sent)"])])});
var fr=friends.map(function(id){return el("div",{class:"row"},[av(id),el("a",{class:"nm",href:"#profile/"+id},[nm(id)])])});
function box(title,items,emptyText){return el("div",{class:"card"},[el("h3",{},[title])].concat(items.length?items:[el("p",{class:"empty"},[emptyText])]))}
return el("aside",{class:"side"},[
box("Friend requests",reqs,"No new requests."),
box("People you may know",others.concat(sent),"No one else has joined yet. Invite a friend!"),
box("Your friends ("+friends.length+")",fr,"Add your first friend.")])}

sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){recovering=true;draw()}else if(ev==="SIGNED_OUT"){me=null;D=null;draw()}});
window.addEventListener("hashchange",function(){say("");editing=false;draft=null;X={};draw();window.scrollTo(0,0)});
refresh();
setInterval(async function(){
if(!me)return;
var r=await sb.from("notifications").select("id",{count:"exact",head:true}).eq("read",false);
var b=document.getElementById("bell");
if(b&&!r.error)b.textContent="Notifications"+(r.count?" ("+r.count+")":"")},30000);
})();
</script>
