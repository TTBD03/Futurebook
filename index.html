<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futurebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eceefa;--card:#fff;--ink:#151530;--mute:#63678a;--line:#dfe2f3;--pri:#3030e8;--onpri:#fff;--like:#ff4f5e;--soft:#e8e8ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#191a31;--ink:#eef0ff;--mute:#9a9ec6;--line:#2a2c4d;--pri:#8c8cff;--onpri:#10102a;--like:#ff7480;--soft:#26284a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.logo{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--pri);letter-spacing:-.03em}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
.auth .logo{font-size:3rem}
.auth p{color:var(--mute);margin:.25rem 0 1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--pri);padding:0;font-weight:600}
.msg{margin:0 0 10px;min-height:1.4em;color:var(--like)}
.msg.ok{color:var(--pri)}
header.top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.meta small{color:var(--mute);display:block}
.post p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:8px;align-items:center}
.acts button{background:none;border:0;color:var(--mute);font-weight:600;padding:4px 0}
.acts button.on{color:var(--like)}
.cmt{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;overflow-wrap:anywhere}
.cmt b{margin-right:6px}
.side h3{font-size:1.05rem;margin-bottom:10px}
.side .row{margin-bottom:10px}
.empty{color:var(--mute);margin:0}
img.av{object-fit:cover}
.pimg{width:100%;max-height:560px;object-fit:cover;border-radius:12px;margin:6px 0 10px;display:block}
input[type=file]{padding:8px}
.foot{max-width:980px;margin:0 auto;padding:8px 16px 32px;display:flex;gap:16px}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var SUPABASE_URL="https://ilucqqkzdbfrnxmffvbz.supabase.co";
var SUPABASE_KEY="sb_publishable_iB2bMJMLJuP5gE4pAdDvyg_Lo2jptUN";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var COLORS=["#3030e8","#e8453c","#0f9d73","#c2410c","#7c3aed","#0e7490"];
var root=document.getElementById("app");
var me=null,D=null,mode="up",notice={text:"",ok:false};

function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in attrs||{}){if(k==="class")e.className=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==null)e.setAttribute(k,attrs[k])}
(kids||[]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function say(t,ok){notice={text:t,ok:!!ok}}
function ago(t){var m=Math.floor((Date.now()-new Date(t).getTime())/6e4);return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" h ago":Math.floor(m/1440)+" d ago"}
function nm(id){var p=D&&D.names[id];return p||"Someone"}
function av(id){var pic=D&&D.avatars&&D.avatars[id];if(pic)return el("img",{class:"av",src:pic,alt:""});var h=0;for(var i=0;i<id.length;i++)h=(h+id.charCodeAt(i))%COLORS.length;var e=el("div",{class:"av"},[nm(id).charAt(0).toUpperCase()]);e.style.background=COLORS[h];return e}
async function act(fn){try{await fn()}catch(e){say(e.message||"Something went wrong. Try again.")}await refresh()}

async function loadData(){
var r=await Promise.all([
sb.from("profiles").select("id,name,avatar_url"),
sb.from("posts").select("id,user_id,body,created_at").order("created_at",{ascending:false}).limit(60),
sb.from("likes").select("post_id,user_id"),
sb.from("comments").select("id,post_id,user_id,body,created_at").order("created_at",{ascending:true}),
sb.from("friendships").select("id,requester,addressee,status"),
sb.from("blocks").select("blocked")]);
for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;
var names={},avatars={};r[0].data.forEach(function(p){names[p.id]=p.name;if(p.avatar_url)avatars[p.id]=p.avatar_url});
D={names:names,posts:r[1].data,likes:r[2].data,comments:r[3].data,fs:r[4].data,blocked:r[5].data.map(function(b){return b.blocked}),avatars:avatars,imgs:{}};
var paths=D.posts.filter(function(p){return p.image_path}).map(function(p){return p.image_path});
if(paths.length){var su=await sb.storage.from("post-images").createSignedUrls(paths,3600);
if(!su.error)su.data.forEach(function(x){if(x.signedUrl)D.imgs[x.path]=x.signedUrl})}}

async function refresh(){
var s=(await sb.auth.getSession()).data.session;
me=s?s.user:null;
if(me){try{await loadData()}catch(e){say("Couldn’t load your data: "+e.message)}}
draw()}

function draw(){root.innerHTML="";root.appendChild(me&&D?feed():auth())}

function auth(){
var name=el("input",{placeholder:"Full name","aria-label":"Full name",autocomplete:"name"});
var email=el("input",{type:"email",placeholder:"Email","aria-label":"Email",autocomplete:"email"});
var pw=el("input",{type:"password",placeholder:"Password (at least 6 characters)","aria-label":"Password",autocomplete:mode==="up"?"new-password":"current-password"});
if(mode==="in")name.style.display="none";
var go=el("button",{class:"btn",onclick:async function(){
go.disabled=true;
try{
if(mode==="up"){
if(!name.value.trim()){throw new Error("Enter your full name.")}
var r=await sb.auth.signUp({email:email.value.trim(),password:pw.value,options:{data:{name:name.value.trim()}}});
if(r.error)throw r.error;
if(!r.data.session){say("Account created. Check your email to confirm it, then log in.",true);mode="in";draw();return}
}else{
var r2=await sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value});
if(r2.error)throw r2.error}
say("");await refresh();
}catch(e){say(e.message);draw()}
}},[mode==="up"?"Create account":"Log in"]);
var sw=el("button",{class:"link",onclick:function(){mode=mode==="up"?"in":"up";say("");draw()}},[mode==="up"?"Already have an account? Log in":"New here? Create an account"]);
return el("main",{class:"auth"},[el("div",{class:"logo"},["Futurebook"]),el("p",{},["Connect with friends and share what’s happening."]),
el("div",{class:"card"},[name,email,pw,el("p",{class:"msg"+(notice.ok?" ok":""),role:"alert"},[notice.text]),el("div",{class:"row"},[go,sw])]),
el("p",{style:"font-size:.9rem"},["By creating an account you agree to our ",el("a",{href:"terms.html"},["Terms"])," and ",el("a",{href:"privacy.html"},["Privacy Policy"]),"."])])}

function shrink(file,max){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("Couldn’t read that image."))},"image/jpeg",0.82)};
img.onerror=function(){rej(new Error("That file isn’t a supported image. Use a JPG, PNG or WebP."))};img.src=u})}
function avInput(){return el("input",{type:"file",id:"avfile",accept:"image/jpeg,image/png,image/webp","aria-label":"Choose a profile photo",style:"display:none",onchange:function(e){var f=e.target.files[0];if(!f)return;
act(async function(){var b=await shrink(f,320);var path=me.id+"/avatar.jpg";
var up=await sb.storage.from("avatars").upload(path,b,{contentType:"image/jpeg",upsert:true});if(up.error)throw up.error;
var url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
var r=await sb.from("profiles").update({avatar_url:url}).eq("id",me.id);if(r.error)throw r.error;say("Profile photo updated.",true)})}})}
function feed(){
var ta=el("textarea",{rows:"3",placeholder:"What’s on your mind, "+nm(me.id).split(" ")[0]+"?","aria-label":"New post",maxlength:"2000"});
var pic=el("input",{type:"file",accept:"image/jpeg,image/png,image/webp","aria-label":"Add a photo"});
var box=el("div",{class:"card"},[ta,pic,el("button",{class:"btn",onclick:function(){var v=ta.value.trim(),f=pic.files&&pic.files[0];if(!v&&!f)return;
act(async function(){var path=null;
if(f){var b=await shrink(f,1280);path=me.id+"/"+Date.now()+".jpg";var up=await sb.storage.from("post-images").upload(path,b,{contentType:"image/jpeg"});if(up.error)throw up.error}
var r=await sb.from("posts").insert({user_id:me.id,body:v||" ",image_path:path});if(r.error)throw r.error;say("")})}},["Post"])]);
var list=el("div",{},D.posts.length?D.posts.map(post):[el("p",{class:"empty"},["No posts yet. Write your first post or add friends."])]);
return el("div",{},[
el("header",{class:"top"},[el("div",{class:"logo"},["Futurebook"]),el("div",{class:"row"},[av(me.id),el("b",{},[nm(me.id)]),avInput(),el("button",{class:"link",onclick:function(){document.getElementById("avfile").click()}},["Change photo"]),
el("button",{class:"link",onclick:function(){refresh()}},["Refresh"]),
el("button",{class:"link",onclick:async function(){await sb.auth.signOut();D=null;say("");await refresh()}},["Log out"])])]),
el("div",{class:"wrap"},[el("main",{},[el("p",{class:"msg"+(notice.ok?" ok":""),role:"alert"},[notice.text]),box,list]),side()]),
el("footer",{class:"foot"},[el("a",{href:"privacy.html"},["Privacy"]),el("a",{href:"terms.html"},["Terms"])])])}

function post(p){
var likes=D.likes.filter(function(l){return l.post_id===p.id});
var liked=likes.some(function(l){return l.user_id===me.id});
var cms=D.comments.filter(function(c){return c.post_id===p.id});
var cin=el("input",{placeholder:"Write a comment","aria-label":"Write a comment",maxlength:"1000"});
cin.addEventListener("keydown",function(e){if(e.key==="Enter"&&cin.value.trim()){var v=cin.value.trim();
act(async function(){var r=await sb.from("comments").insert({post_id:p.id,user_id:me.id,body:v});if(r.error)throw r.error})}});
var acts=[el("button",{class:liked?"on":"","aria-pressed":String(liked),onclick:function(){act(async function(){
var r=liked?await sb.from("likes").delete().eq("post_id",p.id).eq("user_id",me.id):await sb.from("likes").insert({post_id:p.id,user_id:me.id});if(r.error)throw r.error})}},[(liked?"Liked":"Like")+" ("+likes.length+")"]),
el("span",{class:"empty"},[cms.length+(cms.length===1?" comment":" comments")])];
if(p.user_id!==me.id){
acts.push(el("button",{onclick:function(){var why=prompt("Why are you reporting this post?");if(!why||!why.trim())return;
act(async function(){var r=await sb.from("reports").insert({reporter:me.id,post_id:p.id,reported_user:p.user_id,reason:why.trim().slice(0,500)});if(r.error)throw r.error;say("Thanks. Your report was sent.",true)})}},["Report"]));
acts.push(el("button",{onclick:function(){if(!confirm("Block "+nm(p.user_id)+"? You will no longer be friends and they can’t send you requests."))return;
act(async function(){var u=p.user_id;var r=await sb.from("blocks").insert({blocker:me.id,blocked:u});if(r.error)throw r.error;
var d=await sb.from("friendships").delete().or("and(requester.eq."+me.id+",addressee.eq."+u+"),and(requester.eq."+u+",addressee.eq."+me.id+")");if(d.error)throw d.error;say(nm(u)+" is blocked.",true)})}},["Block"]));
}
if(p.user_id===me.id)acts.push(el("button",{onclick:function(){if(confirm("Delete this post?"))act(async function(){var r=await sb.from("posts").delete().eq("id",p.id);if(r.error)throw r.error;if(p.image_path)await sb.storage.from("post-images").remove([p.image_path])})}},["Delete"]));
return el("article",{class:"card post"},[
el("div",{class:"row"},[av(p.user_id),el("div",{class:"meta"},[el("b",{},[nm(p.user_id)]),el("small",{},[ago(p.created_at)])])]),
p.body.trim()?el("p",{},[p.body]):"",
p.image_path&&D.imgs[p.image_path]?el("img",{class:"pimg",src:D.imgs[p.image_path],alt:"Photo shared by "+nm(p.user_id),loading:"lazy"}):"",
el("div",{class:"acts"},acts),
el("div",{},cms.map(function(c){return el("div",{class:"cmt"},[el("b",{},[nm(c.user_id)]),c.body])})),
el("div",{style:"margin-top:8px"},[cin])])}

function side(){
var incoming=D.fs.filter(function(f){return f.addressee===me.id&&f.status==="pending"});
var friends=D.fs.filter(function(f){return f.status==="accepted"}).map(function(f){return f.requester===me.id?f.addressee:f.requester});
var linked={};D.fs.forEach(function(f){linked[f.requester===me.id?f.addressee:f.requester]=f});
var reqs=incoming.map(function(f){return el("div",{class:"row"},[av(f.requester),el("span",{},[nm(f.requester)]),
el("button",{class:"btn",onclick:function(){act(async function(){var r=await sb.from("friendships").update({status:"accepted"}).eq("id",f.id);if(r.error)throw r.error})}},["Accept"]),
el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").delete().eq("id",f.id);if(r.error)throw r.error})}},["Decline"])])});
var others=Object.keys(D.names).filter(function(id){return id!==me.id&&!linked[id]&&D.blocked.indexOf(id)<0}).map(function(id){
return el("div",{class:"row"},[av(id),el("span",{},[nm(id)]),el("button",{class:"btn alt",onclick:function(){act(async function(){var r=await sb.from("friendships").insert({requester:me.id,addressee:id});if(r.error)throw r.error})}},["Add friend"])])});
var sent=D.fs.filter(function(f){return f.requester===me.id&&f.status==="pending"}).map(function(f){
return el("div",{class:"row"},[av(f.addressee),el("span",{},[nm(f.addressee)+" (request sent)"])])});
var fr=friends.map(function(id){return el("div",{class:"row"},[av(id),el("span",{},[nm(id)])])});
function box(title,items,emptyText){return el("div",{class:"card"},[el("h3",{},[title])].concat(items.length?items:[el("p",{class:"empty"},[emptyText])]))}
return el("aside",{class:"side"},[
box("Friend requests",reqs,"No new requests."),
box("People you may know",others.concat(sent),"No one else has joined yet. Invite a friend!"),
box("Your friends ("+friends.length+")",fr,"Add your first friend.")])}

sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"){me=null;D=null;draw()}});
refresh();
})();
</script>
</body>
</html>
